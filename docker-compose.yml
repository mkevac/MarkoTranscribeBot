services:
  # Local Bot API server: no 20 MB download limit, and getFile returns a local
  # path that the bot reads from the shared volume instead of downloading.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.0
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    ports:
      - 127.0.0.1:8081:8081

  markotranscribebot:
    image: mkevac/markotranscribebot:latest
    build: .
    depends_on:
      - telegram-bot-api
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      # Same path as inside the API server, so its file_path works as-is.
      - bot-api-data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

volumes:
  bot-api-data:
