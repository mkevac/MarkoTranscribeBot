services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.0
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}"
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  markotranscribebot:
    image: mkevac/markotranscribebot:${TRANSCRIBE_IMAGE_TAG:-0.1.1}
    depends_on:
      - telegram-bot-api
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /app/data
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ./data:/app/data
      - bot-api-data:/var/lib/telegram-bot-api:ro
    restart: unless-stopped

volumes:
  bot-api-data:
